<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 340" width="320" height="340" role="img" aria-label="Animated Bloch Sphere showing qubit state precession">
  <defs>
    <radialGradient id="sphere-light" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#e0f2fe" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.35"/>
    </radialGradient>
    <linearGradient id="vec-grad-l" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace; }
    .ket { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; font-weight: 600; fill: #1e293b; }
    .axis-lbl { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: #64748b; }
  </style>

  <!-- Container -->
  <rect width="320" height="340" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="18" y="26" class="mono" font-size="11" fill="#0284c7" font-weight="600">BLOCH SPHERE // QUBIT STATE</text>
  <circle cx="298" cy="22" r="4" fill="#059669">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(160, 152)">
    <line x1="0" y1="-98" x2="0" y2="98" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/>
    <line x1="-96" y1="0" x2="96" y2="0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/>
    <line x1="-46" y1="32" x2="46" y2="-32" stroke="#cbd5e1" stroke-width="1.1" stroke-dasharray="3 3"/>

    <circle cx="0" cy="0" r="86" fill="url(#sphere-light)" stroke="#0284c7" stroke-opacity="0.5" stroke-width="1.4"/>

    <ellipse cx="0" cy="0" rx="86" ry="26" fill="none" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="4 4"/>
    <path d="M -86 0 A 86 26 0 0 0 86 0" fill="none" stroke="#0284c7" stroke-opacity="0.6" stroke-width="1.3"/>
    <ellipse cx="0" cy="0" rx="34" ry="86" fill="none" stroke="#94a3b8" stroke-opacity="0.55" stroke-width="1" stroke-dasharray="3 4"/>

    <ellipse cx="0" cy="-44" rx="74" ry="21" fill="none" stroke="#7c3aed" stroke-opacity="0.45" stroke-width="1.2" stroke-dasharray="3 3"/>

    <circle cx="0" cy="0" r="3" fill="#475569"/>

    <text x="-11" y="-102" class="ket">|0⟩</text>
    <text x="-11" y="113" class="ket">|1⟩</text>
    <text x="93" y="4" class="ket">|+i⟩</text>
    <text x="-114" y="4" class="ket">|-i⟩</text>
    <text x="-66" y="46" class="ket">|+⟩</text>
    <text x="48" y="-33" class="axis-lbl">|-⟩</text>

    <line x1="0" y1="-44" x2="74" y2="-44" stroke="#7c3aed" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="2 2">
      <animate attributeName="x2" values="74;52;0;-52;-74;-52;0;52;74" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="-44;-29;-23;-29;-44;-59;-65;-59;-44" dur="6s" repeatCount="indefinite"/>
    </line>

    <line x1="0" y1="0" x2="74" y2="-44" stroke="url(#vec-grad-l)" stroke-width="2.8" stroke-linecap="round">
      <animate attributeName="x2" values="74;52;0;-52;-74;-52;0;52;74" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="-44;-29;-23;-29;-44;-59;-65;-59;-44" dur="6s" repeatCount="indefinite"/>
    </line>

    <circle cx="74" cy="-44" r="5.5" fill="#7c3aed">
      <animate attributeName="cx" values="74;52;0;-52;-74;-52;0;52;74" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="-44;-29;-23;-29;-44;-59;-65;-59;-44" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="74" cy="-44" r="2.2" fill="#ffffff">
      <animate attributeName="cx" values="74;52;0;-52;-74;-52;0;52;74" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="-44;-29;-23;-29;-44;-59;-65;-59;-44" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <line x1="18" y1="276" x2="302" y2="276" stroke="#cbd5e1" stroke-width="1"/>
  <text x="160" y="296" text-anchor="middle" class="mono" font-size="11.5" fill="#0f172a">
    |ψ⟩ = cos(θ/2)|0⟩ + e^(iφ)sin(θ/2)|1⟩
  </text>

  <text x="20" y="319" class="mono" font-size="10" fill="#475569">P(|0⟩)</text>
  <rect x="64" y="311" width="90" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="64" y="311" width="66" height="8" rx="4" fill="#0284c7">
    <animate attributeName="width" values="66;58;70;66" dur="6s" repeatCount="indefinite"/>
  </rect>

  <text x="168" y="319" class="mono" font-size="10" fill="#475569">P(|1⟩)</text>
  <rect x="212" y="311" width="90" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="212" y="311" width="24" height="8" rx="4" fill="#7c3aed">
    <animate attributeName="width" values="24;32;20;24" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
