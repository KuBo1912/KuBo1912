<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 340" width="320" height="340" role="img" aria-label="Animated Bloch Sphere showing qubit state precession">
  <defs>
    <radialGradient id="sphere-dark" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#1e293b" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.85"/>
    </radialGradient>
    <linearGradient id="vec-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="dot-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace; }
    .ket { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; font-weight: 600; fill: #cbd5e1; }
    .axis-lbl { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: #64748b; }
  </style>

  <!-- Container -->
  <rect width="320" height="340" rx="14" fill="#0d1321" stroke="#1e293b" stroke-width="1.5"/>
  <text x="18" y="26" class="mono" font-size="11" fill="#38bdf8" font-weight="600">BLOCH SPHERE // QUBIT STATE</text>
  <circle cx="298" cy="22" r="4" fill="#34d399">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Sphere Center: (160, 152), Radius: 86 -->
  <g transform="translate(160, 152)">
    <!-- Back axes -->
    <line x1="0" y1="-98" x2="0" y2="98" stroke="#334155" stroke-width="1.2" stroke-dasharray="3 3"/>
    <line x1="-96" y1="0" x2="96" y2="0" stroke="#334155" stroke-width="1.2" stroke-dasharray="3 3"/>
    <line x1="-46" y1="32" x2="46" y2="-32" stroke="#334155" stroke-width="1.1" stroke-dasharray="3 3"/>

    <!-- Sphere body -->
    <circle cx="0" cy="0" r="86" fill="url(#sphere-dark)" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.4"/>

    <!-- Equator ellipse -->
    <ellipse cx="0" cy="0" rx="86" ry="26" fill="none" stroke="#475569" stroke-width="1.1" stroke-dasharray="4 4"/>
    <path d="M -86 0 A 86 26 0 0 0 86 0" fill="none" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1.3"/>

    <!-- Meridian ellipse -->
    <ellipse cx="0" cy="0" rx="34" ry="86" fill="none" stroke="#475569" stroke-opacity="0.55" stroke-width="1" stroke-dasharray="3 4"/>

    <!-- Precession latitude orbit at y = -44, rx = 74, ry = 21 -->
    <ellipse cx="0" cy="-44" rx="74" ry="21" fill="none" stroke="#c084fc" stroke-opacity="0.45" stroke-width="1.2" stroke-dasharray="3 3"/>

    <!-- Center origin dot -->
    <circle cx="0" cy="0" r="3" fill="#94a3b8"/>

    <!-- Axis Ket Labels -->
    <text x="-11" y="-102" class="ket">|0⟩</text>
    <text x="-11" y="113" class="ket">|1⟩</text>
    <text x="93" y="4" class="ket">|+i⟩</text>
    <text x="-114" y="4" class="ket">|-i⟩</text>
    <text x="-66" y="46" class="ket">|+⟩</text>
    <text x="48" y="-33" class="axis-lbl">|-⟩</text>

    <!-- Animated State Vector |ψ⟩ precessing smoothly along latitude ellipse -->
    <!-- Projection line to Z axis -->
    <line x1="0" y1="-44" x2="74" y2="-44" stroke="#c084fc" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="2 2">
      <animate attributeName="x2" values="74;52;0;-52;-74;-52;0;52;74" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="-44;-29;-23;-29;-44;-59;-65;-59;-44" dur="6s" repeatCount="indefinite"/>
    </line>

    <!-- Main Vector Shaft -->
    <line x1="0" y1="0" x2="74" y2="-44" stroke="url(#vec-grad)" stroke-width="2.8" stroke-linecap="round">
      <animate attributeName="x2" values="74;52;0;-52;-74;-52;0;52;74" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="-44;-29;-23;-29;-44;-59;-65;-59;-44" dur="6s" repeatCount="indefinite"/>
    </line>

    <!-- Vector Tip Glowing Qubit -->
    <circle cx="74" cy="-44" r="5.5" fill="#c084fc" filter="url(#dot-glow)">
      <animate attributeName="cx" values="74;52;0;-52;-74;-52;0;52;74" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="-44;-29;-23;-29;-44;-59;-65;-59;-44" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="74" cy="-44" r="2.2" fill="#ffffff">
      <animate attributeName="cx" values="74;52;0;-52;-74;-52;0;52;74" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="-44;-29;-23;-29;-44;-59;-65;-59;-44" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Bottom State Equation & Probability Bars -->
  <line x1="18" y1="276" x2="302" y2="276" stroke="#1e293b" stroke-width="1"/>
  <text x="160" y="296" text-anchor="middle" class="mono" font-size="11.5" fill="#e2e8f0">
    |ψ⟩ = cos(θ/2)|0⟩ + e^(iφ)sin(θ/2)|1⟩
  </text>

  <!-- P(|0⟩) Bar -->
  <text x="20" y="319" class="mono" font-size="10" fill="#94a3b8">P(|0⟩)</text>
  <rect x="64" y="311" width="90" height="8" rx="4" fill="#1e293b"/>
  <rect x="64" y="311" width="66" height="8" rx="4" fill="#38bdf8">
    <animate attributeName="width" values="66;58;70;66" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- P(|1⟩) Bar -->
  <text x="168" y="319" class="mono" font-size="10" fill="#94a3b8">P(|1⟩)</text>
  <rect x="212" y="311" width="90" height="8" rx="4" fill="#1e293b"/>
  <rect x="212" y="311" width="24" height="8" rx="4" fill="#c084fc">
    <animate attributeName="width" values="24;32;20;24" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
