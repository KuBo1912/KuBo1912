<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 28" width="900" height="28" role="img" aria-label="Quantum Wave Interference Divider">
  <defs>
    <linearGradient id="wave-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#c084fc" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wave-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0"/>
      <stop offset="30%" stop-color="#34d399" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="div-clip">
      <rect x="0" y="0" width="900" height="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#div-clip)">
    <!-- Wave 1 -->
    <path d="M -180 14 Q -135 4 -90 14 T 0 14 T 90 14 T 180 14 T 270 14 T 360 14 T 450 14 T 540 14 T 630 14 T 720 14 T 810 14 T 900 14 T 990 14 T 1080 14"
          fill="none" stroke="url(#wave-grad-1)" stroke-width="1.8">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="180 0" dur="5s" repeatCount="indefinite"/>
    </path>
    <!-- Wave 2 (phase-shifted interference) -->
    <path d="M 0 14 Q 45 24 90 14 T 180 14 T 270 14 T 360 14 T 450 14 T 540 14 T 630 14 T 720 14 T 810 14 T 900 14 T 990 14 T 1080 14"
          fill="none" stroke="url(#wave-grad-2)" stroke-width="1.3">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-180 0" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
