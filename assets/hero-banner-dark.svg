<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="Trần Việt Dũng - CS Student at HCMUT-VNU - Quantum Computing and HPQC">
  <defs>
    <clipPath id="card-clip-dark">
      <rect x="0.7" y="0.7" width="898.6" height="218.6" rx="13.5"/>
    </clipPath>
    <linearGradient id="bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow-center-dark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-accent-dark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Typing clip paths inside centered box (x=195..705) -->
    <clipPath id="type-clip-1">
      <rect x="210" y="146" height="26" width="0">
        <animate attributeName="width" values="0;470;470;0;0" keyTimes="0;0.24;0.46;0.5;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="type-clip-2">
      <rect x="210" y="146" height="26" width="0">
        <animate attributeName="width" values="0;0;470;470;0" keyTimes="0;0.5;0.74;0.96;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 700; fill: #f8fafc; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 500; fill: #94a3b8; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Clipped Background, Soft Animated Ambient Gradient & Top Hairline -->
  <g clip-path="url(#card-clip-dark)">
    <rect width="900" height="220" fill="url(#bg-dark)"/>
    <ellipse cx="380" cy="110" rx="280" ry="150" fill="url(#glow-center-dark)">
      <animate attributeName="cx" values="350;550;350" dur="14s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="560" cy="120" rx="240" ry="140" fill="url(#glow-accent-dark)">
      <animate attributeName="cx" values="570;370;570" dur="16s" repeatCount="indefinite"/>
    </ellipse>
    <rect x="0" y="0" width="900" height="3" fill="url(#accent-grad)"/>
  </g>

  <!-- Clean Rounded Border -->
  <rect x="0.7" y="0.7" width="898.6" height="218.6" rx="13.5" fill="none" stroke="#1e293b" stroke-width="1.4"/>

  <!-- Centered Top Affiliation Pill -->
  <g transform="translate(332, 26)">
    <rect x="0" y="0" width="236" height="24" rx="12" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
    <circle cx="15" cy="12" r="3.5" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="27" y="16" class="mono" font-size="11" fill="#cbd5e1">HCMUT-VNU · Computer Science</text>
  </g>

  <!-- Centered Name & Subtitle -->
  <text x="450" y="96" text-anchor="middle" class="title" font-size="38" letter-spacing="-0.6">Trần Việt Dũng</text>

  <text x="450" y="124" text-anchor="middle" class="subtitle" font-size="15">
    CS Student focusing on <tspan fill="#38bdf8" font-weight="600">Quantum Computing</tspan> &amp; <tspan fill="#c084fc" font-weight="600">HPQC</tspan>
  </text>

  <!-- Centered Minimalist Typing Box -->
  <rect x="195" y="142" width="510" height="34" rx="8" fill="#0b1120" fill-opacity="0.88" stroke="#1e293b" stroke-width="1"/>
  <text x="212" y="163" class="mono" font-size="12.5" fill="#38bdf8" clip-path="url(#type-clip-1)">
    &gt; Learning &amp; exploring Quantum Computing
  </text>
  <text x="212" y="163" class="mono" font-size="12.5" fill="#c084fc" clip-path="url(#type-clip-2)">
    &gt; Aspiring toward High-Performance Quantum Computing
  </text>
  <rect x="688" y="152" width="6" height="14" rx="1" fill="#38bdf8">
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>

  <!-- Centered Footer -->
  <text x="450" y="200" text-anchor="middle" class="mono" font-size="11" fill="#64748b">
    Ho Chi Minh City, Vietnam · Class of 2025
  </text>
</svg>
